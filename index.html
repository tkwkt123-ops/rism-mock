<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f3ea">
<title>R'ism 見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f3ea; --card: #fffdf6; --ink: #2f3d37; --soft: #7b847f; --line: #e2ddcd;
    --green: #2f6b4f; --turf: #8fb47a; --sky: #8fc3d9; --aqua: #cfe8de; --sun: #f2d46b; --red: #c9504a; --kraft: #c8a77a;
    --mincho: "Shippori Mincho", "Hiragino Mincho ProN", serif; --maru: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; --hand: "Klee One", "Zen Maru Gothic", sans-serif;
    --tab: 64px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--maru); font-size: 15px; padding-bottom: calc(var(--tab) + env(safe-area-inset-bottom) + 24px); }
  body::before { content: ""; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
    background: radial-gradient(38% 30% at 10% 6%, rgba(143,180,122,.38), transparent 70%), radial-gradient(30% 26% at 95% 14%, rgba(143,195,217,.35), transparent 70%),
      radial-gradient(34% 28% at 82% 90%, rgba(207,232,222,.6), transparent 70%), radial-gradient(26% 22% at 15% 85%, rgba(242,212,107,.25), transparent 70%); filter: blur(20px); }
  button { font-family: inherit; color: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  .eyebrow { font-size: 11px; letter-spacing: .3em; color: var(--green); font-weight: 700; }
  h1, h2, h3 { font-family: var(--mincho); margin: 0; }
  .muted { color: var(--soft); font-size: 12px; }
  .mock-band { background: var(--sun); color: var(--ink); font-size: 11px; text-align: center; padding: 4px; padding-top: calc(env(safe-area-inset-top) + 4px); letter-spacing: .05em; }
  .top { display: flex; justify-content: space-between; align-items: flex-end; padding: 16px 0 12px; }
  .top h2 { font-size: 26px; margin-top: 2px; }
  .who { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 3px; }
  .who button { border: none; background: none; border-radius: 16px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .who button.on { background: var(--green); color: #fff; }
  .view { display: none; } .view.on { display: block; animation: fade .2s; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } }

  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tab) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: rgba(246,243,234,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; z-index: 20; }
  .tabbar button { flex: 1; border: none; background: none; font-size: 10px; color: var(--soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; position: relative; }
  .tabbar .ic { font-size: 19px; filter: grayscale(1); opacity: .6; }
  .tabbar button.on { color: var(--green); font-weight: 700; } .tabbar button.on .ic { filter: none; opacity: 1; }
  .badge { position: absolute; top: 6px; left: calc(50% + 6px); background: var(--red); color: #fff; font-size: 9px; border-radius: 8px; padding: 0 5px; font-weight: 700; }

  /* 今日 */
  .seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; background: none; padding: 5px 16px; font-size: 13px; cursor: pointer; }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .daybar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .summary { display: flex; gap: 18px; margin: 8px 0 18px; }
  .summary .n { font-family: var(--mincho); font-size: 40px; font-weight: 700; line-height: 1; }
  .summary .n small { font-size: 14px; color: var(--red); margin-left: 2px; }
  .slot { display: flex; gap: 12px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; cursor: pointer; position: relative; }
  .slot .time { font-family: var(--mincho); font-size: 18px; font-weight: 700; width: 52px; flex: none; }
  .slot .time small { display: block; font-family: var(--maru); font-size: 10px; color: var(--soft); font-weight: 400; }
  .slot .body { flex: 1; min-width: 0; }
  .slot .nm { font-family: var(--mincho); font-size: 17px; font-weight: 700; }
  .slot .pt { font-size: 13px; margin-top: 4px; line-height: 1.6; }
  .slot.trial { border-color: var(--sun); box-shadow: inset 4px 0 0 var(--sun); }
  .tags { margin-top: 6px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; margin: 2px 4px 2px 0; background: var(--aqua); color: var(--green); }
  .tag.warn { background: #f8dcd8; color: var(--red); }
  .tag.sun { background: #faefc4; color: #8a6a12; }
  .tag.gray { background: #ebe7dc; color: var(--soft); }

  /* お客様 */
  .search { width: 100%; padding: 11px 12px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; font-size: 16px; font-family: inherit; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 12px; }
  .chip { flex: none; border: 1.5px solid var(--green); color: var(--green); padding: 3px 12px; border-radius: 14px; font-size: 12px; background: transparent; cursor: pointer; }
  .chip.on { background: var(--green); color: #fff; }
  .cust { display: flex; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px dashed var(--line); cursor: pointer; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-family: var(--mincho); font-weight: 700; color: #fff; font-size: 18px; }
  .cust .main { flex: 1; min-width: 0; }
  .cust .main b { font-family: var(--mincho); font-size: 16px; }
  .cust .main .pt { font-size: 12px; color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .cust .rt { text-align: right; font-size: 11px; color: var(--soft); white-space: nowrap; }
  .meter { display: inline-flex; gap: 3px; margin-top: 4px; }
  .meter i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--green); }
  .meter i.used { background: var(--green); }

  /* カード */
  .sheet-bg { position: fixed; inset: 0; background: rgba(47,61,55,.4); z-index: 40; display: none; } .sheet-bg.on { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 93vh; overflow-y: auto; background: var(--paper); border-radius: 18px 18px 0 0; z-index: 41; transform: translateY(100%); transition: transform .28s; padding: 10px 0 calc(env(safe-area-inset-bottom) + 24px); }
  .sheet.on { transform: none; }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: #cfc6b2; margin: 0 auto 12px; cursor: pointer; }
  .card-head { display: flex; gap: 14px; align-items: center; }
  .card-head .avatar { width: 60px; height: 60px; font-size: 26px; }
  .card-head h3 { font-size: 24px; }
  .point { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 14px 0; font-family: var(--hand); font-size: 15px; line-height: 1.8; position: relative; }
  .point .lab, .box .lab { font-family: var(--maru); font-size: 10px; letter-spacing: .3em; color: var(--soft); font-weight: 700; display: block; margin-bottom: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .box .v { font-family: var(--mincho); font-size: 22px; font-weight: 700; }
  .box .v small { font-size: 12px; font-family: var(--maru); color: var(--soft); font-weight: 400; }
  .event { display: flex; gap: 10px; align-items: center; background: #faefc4; border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 13px; }
  .event b { font-family: var(--mincho); font-size: 18px; }
  .sec { margin: 22px 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .note { border-left: 3px solid var(--turf); padding: 4px 0 4px 12px; margin-bottom: 14px; }
  .note .meta { font-size: 11px; color: var(--soft); }
  .note .tx { font-family: var(--hand); font-size: 15px; line-height: 1.8; margin-top: 2px; }
  .lesson { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .btn { border: 1.5px solid var(--ink); background: transparent; padding: 11px; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%; }
  .btn.green { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.red { background: var(--red); border-color: var(--red); color: #fff; }
  .form label { display: block; font-size: 10px; letter-spacing: .25em; color: var(--soft); font-weight: 700; margin: 14px 0 5px; }
  .form input, .form textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-family: inherit; font-size: 16px; color: var(--ink); }
  .form textarea { font-family: var(--hand); min-height: 110px; line-height: 1.8; }

  /* 確認 */
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; transition: opacity .3s, transform .3s; }
  .q.done { opacity: 0; transform: translateX(40px); }
  .q .code { font-size: 10px; letter-spacing: .2em; color: var(--red); font-weight: 700; }
  .q .ttl { font-family: var(--mincho); font-size: 17px; font-weight: 700; margin: 4px 0; }
  .q .why { font-size: 13px; line-height: 1.7; color: var(--ink); }
  .q .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .q .acts button { flex: 1 1 auto; border: 1.5px solid var(--green); background: transparent; color: var(--green); padding: 8px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .q .acts button.main { background: var(--green); color: #fff; }
  .q .acts button.later { border-color: var(--line); color: var(--soft); flex: 0 0 auto; }

  /* 数字 */
  .kpi { display: grid; grid-template-columns: 1fr 1fr; border-top: 2px solid var(--ink); border-bottom: 1px dashed var(--soft); padding: 12px 0; margin-bottom: 4px; }
  .kpi > div + div { border-left: 1px solid var(--line); padding-left: 14px; }
  .kpi .v { font-family: var(--mincho); font-size: 30px; font-weight: 700; } .kpi .v small { font-size: 13px; }
  .kpi .d { font-size: 11px; } .up { color: var(--green); } .down { color: var(--red); }
  .blk { padding: 14px 0; border-bottom: 1px dashed var(--soft); }
  .blk .lab { font-size: 10px; letter-spacing: .3em; color: var(--soft); font-weight: 700; margin-bottom: 10px; }
  .cols { display: flex; align-items: flex-end; gap: 8px; height: 120px; }
  .cols .c { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 10px; color: var(--soft); }
  .cols .c i { width: 100%; background: var(--green); border-radius: 3px 3px 0 0; }
  .cols .c i.now { background: var(--red); }
  .hbar { display: grid; grid-template-columns: 84px 1fr 64px; gap: 8px; align-items: center; font-size: 12px; margin: 6px 0; }
  .hbar .tr { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; } .hbar .tr i { display: block; height: 100%; background: var(--green); }
  .hbar span:last-child { text-align: right; color: var(--soft); }
  .lock { text-align: center; padding: 60px 20px; color: var(--soft); line-height: 2; }
  .toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 34px); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 20px; font-size: 13px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; }

  /* ===== 共通：ヒーロー・線画 ===== */
  .mock-band button { border: 1px solid var(--ink); background: transparent; border-radius: 10px; padding: 0 8px; margin-left: 4px; font-size: 11px; cursor: pointer; }
  .mock-band button.on { background: var(--ink); color: var(--sun); }
  .top { display: none; }
  .hero { position: relative; margin-bottom: 10px; }
  .hero-in { max-width: 720px; margin: 0 auto; padding: 14px 16px 0; position: relative; min-height: 150px; }
  .hero .who { position: absolute; right: 16px; top: 12px; z-index: 3; }
  .hero-txt { position: relative; z-index: 2; padding-top: 34px; }
  .hero-txt h2 { font-size: 30px; font-weight: 500; letter-spacing: .02em; }
  .hero .art { position: absolute; right: 8px; bottom: -6px; width: 170px; height: 120px; z-index: 1; }
  .hero .art svg, .hills svg { width: 100%; height: 100%; display: block; }
  .hills { height: 46px; margin-top: -4px; position: relative; z-index: 0; }
  .ic svg { width: 26px; height: 26px; }
  .tabbar .ic { filter: none !important; opacity: 1 !important; width: 38px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background .2s; }
  .tabbar button.on .ic { background: var(--tabon); }
  .empty-art { width: 180px; margin: 10px auto 0; display: block; }

  /* ===== A：丘（be kids） ===== */
  body.a { --paper: #f4f6ec; --card: #ffffff; --green: #4f8a68; --tabon: #dcecc9; --ink: #34423a; }
  body.a::before { background: radial-gradient(40% 30% at 85% 4%, rgba(207,232,222,.9), transparent 70%), radial-gradient(30% 25% at 10% 10%, rgba(220,236,201,.8), transparent 70%); filter: blur(10px); }
  body.a .hero { background: linear-gradient(#eef5e4, #e4efd6); }
  body.a .hero-txt h2 { font-family: var(--mincho); color: #34423a; }
  body.a .hero .eyebrow { color: #4f8a68; }
  body.a .slot, body.a .box, body.a .point, body.a .q, body.a .search { border-radius: 18px; border-color: #e3ead6; box-shadow: 0 2px 0 #e3ead6; }
  body.a .avatar { border: 2px solid #fff; box-shadow: 0 0 0 1.5px #c6dca8; }
  body.a .sheet { background: #f4f6ec; }

  /* ===== B：深緑（natomi宿＋丘） ===== */
  body.b { --paper: #f7f4ec; --green: #275a45; --tabon: #f6dcd6; }
  body.b::before { display: none; }
  body.b .hero { background: #275a45; color: #f7f4ec; }
  body.b .hero-txt h2 { font-family: var(--hand); font-weight: 600; color: #f7f4ec; font-size: 28px; }
  body.b .hero .eyebrow { color: #f2d46b; }
  body.b .hero .who { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); }
  body.b .hero .who button { color: #f7f4ec; }
  body.b .hero .who button.on { background: #f7f4ec; color: #275a45; }
  body.b .summary > div { background: #f6dcd6; border-radius: 60px 60px 12px 12px; padding: 16px 14px 10px; text-align: center; flex: 1; }
  body.b .summary > div:nth-child(2) { background: #dcecc9; }
  body.b .summary > div:nth-child(3) { background: #faefc4; }
  body.b .summary .n { font-family: var(--hand); }
  body.b .summary > div:nth-child(3) .n { font-size: 22px !important; padding-top: 12px !important; white-space: nowrap; }
  body.b .slot.trial { border-color: #f0b7ad; box-shadow: inset 4px 0 0 #f0b7ad; }
  body.b .slot.trial .tag.sun { background: #f6dcd6; color: #a8473f; }
  body.b .sec .eyebrow, body.b .lab { font-family: var(--hand); }
  body.b .kpi { border-top-color: #275a45; }
  body.b .cols .c i { background: #275a45; }
</style>
</head>
<body>
<div class="mock-band">見本（架空のデータ）　デザイン <button onclick="setTheme('a')" id="th-a">A 丘</button><button onclick="setTheme('b')" id="th-b">B 深緑</button></div>

<section class="view on" id="v-today">
  <header class="hero" data-art="today"><div class="hero-in"><div class="who" id="who1"></div><div class="hero-txt"><div class="eyebrow">R'ISM TODAY</div><h2 id="t-date"></h2></div><div class="art"></div></div><div class="hills"></div></header><div class="wrap">
  <div class="daybar"><div class="seg"><button data-d="0" class="on">今日</button><button data-d="1">明日</button></div><span class="muted" id="t-hours"></span></div>

  <div id="t-list"></div>
</div></section>

<section class="view" id="v-cust">
  <header class="hero" data-art="cust"><div class="hero-in"><div class="who" id="who2"></div><div class="hero-txt"><div class="eyebrow">MEMBERS</div><h2>お客様</h2></div><div class="art"></div></div><div class="hills"></div></header><div class="wrap">

<section class="view" id="v-queue">

  <p class="muted" style="line-height:1.8;margin-top:0">予約やStripeの取り込みで、自動では決められなかったものです。ボタンを押すとシートに反映されます。</p>
  <div id="q-list"></div>
</div></section>

<section class="view" id="v-num">
  <header class="hero" data-art="num"><div class="hero-in"><div class="who" id="who4"></div><div class="hero-txt"><div class="eyebrow">NUMBERS</div><h2>数字</h2></div><div class="art"></div></div><div class="hills"></div></header><div class="wrap">
  <div id="n-body"></div>
</div></section>

<nav class="tabbar">
  <button data-v="today" class="on"><span class="ic" data-i="today"></span>今日</button>
  <button data-v="cust"><span class="ic" data-i="cust"></span>お客様</button>
  <button data-v="queue"><span class="ic" data-i="queue"></span>確認<span class="badge" id="q-badge"></span></button>

</nav>

  const months = [['5月', 612], ['6月', 655], ['7月', 701], ['8月', 642], ['9月', 728], ['10月', 694]];
  const mx = Math.max(...months.map(m => m[1]));
  const bars = (rows, unit) => { const m = Math.max(...rows.map(r => r[1])); return rows.map(([k, v]) => `<div class="hbar"><span>${k}</span><span class="tr"><i style="width:${v / m * 100}%"></i></span><span>${unit(v)}</span></div>`).join(''); };
  $('#n-body').innerHTML = `
    <div class="muted" style="margin-bottom:8px">2026年10月（23日まで）</div>
    <div class="kpi"><div><div class="muted">売上</div><div class="v">69.4<small>万円</small></div><div class="d up">先月同日比 ＋6%</div></div>
      <div><div class="muted">レッスン</div><div class="v">142<small>回</small></div><div class="d up">＋9回</div></div></div>
    <div class="kpi" style="border-top:none"><div><div class="muted">在籍</div><div class="v">86<small>人</small></div><div class="d up">入会 4・退会 1</div></div>
      <div><div class="muted">体験 → 入会</div><div class="v">4<small>/7人</small></div><div class="d">入会率 57%</div></div></div>
    <div class="blk"><div class="lab">月別の売上（万円）</div><div class="cols">${months.map(([k, v], i) => `<div class="c"><span>${(v / 10).toFixed(0)}</span><i class="${i === months.length - 1 ? 'now' : ''}" style="height:${v / mx * 85}%"></i><span>${k}</span></div>`).join('')}</div></div>
    <div class="blk"><div class="lab">売上の内訳</div>${bars([['月額', 412000], ['R\'ism会員', 149000], ['回数券', 78000], ['都度払い', 32500], ['体験', 21000], ['工房・物販', 1800]], v => (v / 10000).toFixed(1) + '万')}</div>
    <div class="blk"><div class="lab">担当別レッスン</div>${bars([['古賀', 81], ['千葉', 61]], v => v + '回')}</div>
    <div class="blk" style="border:none"><div class="lab">フォローしたい人</div>
      ${CUSTOMERS.filter(c => c.status === '在籍' && (c.last >= 30 || (c.plan === '回数券' && c.ticket <= 2))).map(c => `<div class="cust" onclick="showCust('${c.id}')">${avatar(c)}<div class="main"><b>${c.name}</b><div class="pt">${c.last >= 30 ? `${c.last}日来ていない` : `回数券 残${c.ticket}`}</div></div></div>`).join('')}</div>`;
}

function renderAll() { renderToday(); renderFilters(); renderCust(); renderQueue(); renderNum(); }
renderWho(); renderAll(); setTheme(theme);
</script>
